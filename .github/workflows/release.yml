name: Release

# Publishes to npm and the MCP Registry when a version tag (e.g. v0.2.0) is pushed.
# npm publishing uses Trusted Publishing (OIDC), so no npm token is stored anywhere.
# The trusted publisher is configured on npmjs.com for this repository and release.yml.
#
# Running it manually (workflow_dispatch) skips npm and only (re)registers the
# version from package.json in the MCP Registry, e.g. after a registry outage.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      # Matches npm's trusted publishing example: Node 24 bundles npm 11 (>= 11.5.1 is
      # required), registry-url is needed for the OIDC exchange, and release builds do
      # not use a dependency cache.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm version
        run: |
          npm --version
          node -e 'const v=process.argv[1].split(".").map(Number), min=[11,5,1]; const d=v.map((x,i)=>x-min[i]).find((x)=>x!==0) ?? 0; if (d<0) { console.error("npm >= 11.5.1 is required for trusted publishing"); process.exit(1) }' "$(npm --version)"

      - name: Check that the tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm ci

      # npm validates package.json before prepublishOnly runs, and without build/
      # it warns "No bin file found" and may drop the bin entry, which breaks npx.
      - run: npm run build

      # prepublishOnly runs the full check (lint, format, typecheck, tests, build).
      # Skipped when the version is already on npm, so a re-run of the workflow is safe.
      # Provenance is generated automatically for trusted publishing from a public repo.
      # If the OIDC exchange fails, npm silently falls back to setup-node's placeholder
      # token and the registry answers 404; verbose logging shows why the exchange failed.
      - name: Publish to npm
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "repo-pulse-mcp@${version}" version >/dev/null 2>&1; then
            echo "repo-pulse-mcp@${version} is already published, skipping."
          else
            npm publish --access public --loglevel verbose
          fi

  mcp-registry:
    name: Publish to the MCP Registry
    needs: npm
    # Also run on workflow_dispatch, where the npm job is skipped.
    if: ${{ !cancelled() && (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry OIDC login
    steps:
      - uses: actions/checkout@v4

      # npm processes a new release for a short while before it can be fetched,
      # and the MCP Registry rejects versions it cannot find on npm yet.
      - name: Wait until the version is available on npm
        run: |
          version="$(node -p 'require("./package.json").version')"
          for attempt in $(seq 1 30); do
            if npm view "repo-pulse-mcp@${version}" version >/dev/null 2>&1; then
              echo "repo-pulse-mcp@${version} is available."
              exit 0
            fi
            echo "Waiting for repo-pulse-mcp@${version} on npm (attempt ${attempt}/30)..."
            sleep 10
          done
          echo "repo-pulse-mcp@${version} did not appear on npm within 5 minutes." >&2
          exit 1

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
